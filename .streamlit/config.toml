[server]
# Deliberately above MAX_UPLOAD_BYTES (25 MB) in
# src/forecasting_engine/ingest/upload.py. If the two matched, Streamlit's own
# generic rejection would fire first and the user would never see our
# size-limit message. Keep this the looser of the two.
maxUploadSize = 30


[client]
# No "Deploy" button or developer menu in the toolbar: the sponsor uses this app,
# they don't deploy it.
toolbarMode = "minimal"


# Atlassian Design System tokens (https://atlassian.design/foundations/color):
# navy text on white, a single blue for actions, neutral greys carrying the
# structure, and green/yellow/red reserved for state. Corners are 3px, the
# classic Atlassian radius, so controls and panels read as squared-off rather
# than as rounded cards. Headings are small and set in the system font, as in
# Jira and Confluence, so the figures carry the page rather than the titles.

[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
baseFontSize = 14
headingFontSizes = ["24px", "20px", "16px", "14px", "12px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
backgroundColor = "#FFFFFF"           # elevation.surface
secondaryBackgroundColor = "#F7F8F9"  # elevation.surface.sunken
textColor = "#172B4D"                 # color.text
primaryColor = "#0C66E4"              # color.background.brand.bold
linkColor = "#0C66E4"                 # color.link
borderColor = "#DCDFE4"               # color.border, on white
dataframeBorderColor = "#DCDFE4"
dataframeHeaderBackgroundColor = "#F7F8F9"
codeBackgroundColor = "#F1F2F4"
codeTextColor = "#172B4D"
chartCategoricalColors = ["#0C66E4", "#8590A2", "#6E5DC6", "#1D7F8C", "#C25100", "#AE2E24"]

greenColor = "#1F845A"                # color.text.success
greenTextColor = "#216E4E"
greenBackgroundColor = "#DCFFF1"      # color.background.success
yellowColor = "#B38600"
yellowTextColor = "#7F5F01"           # color.text.warning
yellowBackgroundColor = "#FFF7D6"     # color.background.warning
orangeColor = "#C25100"
orangeTextColor = "#A54800"
orangeBackgroundColor = "#FFF3EB"
redColor = "#C9372C"                  # color.text.danger
redTextColor = "#AE2E24"
redBackgroundColor = "#FFECEB"        # color.background.danger
blueColor = "#0C66E4"
blueTextColor = "#0055CC"             # color.text.information
blueBackgroundColor = "#E9F2FF"       # color.background.information
grayColor = "#626F86"                 # color.text.subtlest
grayTextColor = "#44546F"             # color.text.subtle
grayBackgroundColor = "#F1F2F4"       # color.background.neutral

[theme.light.sidebar]
backgroundColor = "#F7F8F9"
secondaryBackgroundColor = "#F1F2F4"
textColor = "#44546F"
borderColor = "#DCDFE4"

[theme.dark]
backgroundColor = "#1D2125"           # elevation.surface
secondaryBackgroundColor = "#161A1D"  # elevation.surface.sunken
textColor = "#B6C2CF"                 # color.text
primaryColor = "#579DFF"
linkColor = "#579DFF"
borderColor = "#38414A"
dataframeBorderColor = "#38414A"
dataframeHeaderBackgroundColor = "#161A1D"
codeBackgroundColor = "#22272B"
codeTextColor = "#B6C2CF"
chartCategoricalColors = ["#579DFF", "#8C9BAB", "#9F8FEF", "#6CC3E0", "#FEA362", "#F87168"]

greenColor = "#4BCE97"
greenTextColor = "#7EE2B8"
greenBackgroundColor = "#164B35"
yellowColor = "#F5CD47"
yellowTextColor = "#F5CD47"
yellowBackgroundColor = "#533F04"
orangeColor = "#FEA362"
orangeTextColor = "#FEC195"
orangeBackgroundColor = "#5F3811"
redColor = "#F87168"
redTextColor = "#FD9891"
redBackgroundColor = "#5D1F1A"
blueColor = "#579DFF"
