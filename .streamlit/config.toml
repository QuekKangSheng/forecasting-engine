[server]
# Deliberately above MAX_UPLOAD_BYTES (25 MB) in
# src/forecasting_engine/ingest/upload.py. If the two matched, Streamlit's own
# generic rejection would fire first and the user would never see our
# size-limit message. Keep this the looser of the two.
maxUploadSize = 30

# The app serves its own typefaces from app/static, so they load with no network
# beyond the app's own.
enableStaticServing = true


[client]
# No "Deploy" button or developer menu in the toolbar: the sponsor uses this app,
# they don't deploy it.
toolbarMode = "minimal"


# An operations console: a near-black field, hairlines carrying the structure, small
# spaced capitals in a monospace face for labels, and one blue for whatever can be
# acted on. One theme, dark, designed as such rather than flipped from a light one.
#
# Every colour here is also in app/tokens.py, which the stylesheet (app/ui.py) and
# the charts (app/charts.py) draw from; tests/unit/test_tokens.py fails if the two
# drift apart.

[theme]
base = "dark"
font = "'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
baseFontSize = 14
headingFontSizes = ["28px", "20px", "16px", "14px", "12px", "12px"]
headingFontWeights = [400, 500, 600, 600, 600, 600]
baseRadius = "2px"
buttonRadius = "2px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

backgroundColor = "#0B0D11"
secondaryBackgroundColor = "#171C24"
textColor = "#E9ECF1"
primaryColor = "#4C90F0"
linkColor = "#8ABBFF"
borderColor = "#212833"
dataframeBorderColor = "#212833"
dataframeHeaderBackgroundColor = "#10141A"
codeBackgroundColor = "#10141A"
codeTextColor = "#B7BFCA"
chartCategoricalColors = ["#4C90F0", "#8F99A8", "#CF7A1E", "#32A467", "#D4609A", "#B07CE8"]

greenColor = "#32A467"
greenTextColor = "#72CA9B"
greenBackgroundColor = "#11281E"
yellowColor = "#D1980B"
yellowTextColor = "#FBD065"
yellowBackgroundColor = "#2C2410"
orangeColor = "#C87619"
orangeTextColor = "#FBB360"
orangeBackgroundColor = "#2E2112"
redColor = "#CD4246"
redTextColor = "#FA999C"
redBackgroundColor = "#301719"
blueColor = "#4C90F0"
blueTextColor = "#8ABBFF"
blueBackgroundColor = "#13233D"
grayColor = "#8B95A4"
grayTextColor = "#B7BFCA"
grayBackgroundColor = "#1B2029"

[theme.sidebar]
backgroundColor = "#07090C"
secondaryBackgroundColor = "#10141A"
textColor = "#B7BFCA"
borderColor = "#212833"

# IBM Plex, under the SIL Open Font License (app/static/OFL.txt).
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/IBMPlexSans-Variable.woff2"
weight = "300 700"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/IBMPlexMono-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/IBMPlexMono-Medium.woff2"
weight = 500
style = "normal"
