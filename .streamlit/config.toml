[server]
# Deliberately above MAX_UPLOAD_BYTES (25 MB) in
# src/forecasting_engine/ingest/upload.py. If the two matched, Streamlit's own
# generic rejection would fire first and the user would never see our
# size-limit message. Keep this the looser of the two.
maxUploadSize = 30


# Colours are GitHub Primer's, which an internal analytics tool has no reason to
# depart from: an enterprise blue accent, neutral greys carrying the structure,
# and semantic green/amber/red reserved for state. Atlassian's system is built on
# the same bones. Primer publishes exact values for both themes, so the dark side
# is a designed palette rather than an inversion of the light one.
#
# https://primer.style/foundations/color

[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
backgroundColor = "#FFFFFF"           # canvas.default
secondaryBackgroundColor = "#F6F8FA"  # canvas.subtle
textColor = "#1F2328"                 # fg.default
primaryColor = "#0969DA"              # accent.fg
linkColor = "#0969DA"
borderColor = "#D1D9E0"               # border.default
dataframeBorderColor = "#D1D9E0"
dataframeHeaderBackgroundColor = "#F6F8FA"
codeBackgroundColor = "#F6F8FA"
codeTextColor = "#1F2328"

greenColor = "#1A7F37"                # success.fg
greenTextColor = "#1A7F37"
greenBackgroundColor = "#DAFBE1"      # success.subtle
yellowColor = "#9A6700"               # attention.fg
yellowTextColor = "#9A6700"
yellowBackgroundColor = "#FFF8C5"     # attention.subtle
orangeColor = "#BC4C00"               # severe.fg
orangeTextColor = "#BC4C00"
orangeBackgroundColor = "#FFF1E5"
redColor = "#D1242F"                  # danger.fg
redTextColor = "#D1242F"
redBackgroundColor = "#FFEBE9"        # danger.subtle
blueColor = "#0969DA"
blueTextColor = "#0969DA"
blueBackgroundColor = "#DDF4FF"       # accent.subtle
grayColor = "#59636E"                 # fg.muted
grayTextColor = "#59636E"
grayBackgroundColor = "#F6F8FA"

[theme.dark]
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#151B23"
textColor = "#F0F6FC"
primaryColor = "#4493F8"
linkColor = "#4493F8"
borderColor = "#3D444D"
dataframeBorderColor = "#3D444D"
dataframeHeaderBackgroundColor = "#151B23"
codeBackgroundColor = "#151B23"
codeTextColor = "#F0F6FC"

greenColor = "#3FB950"
greenTextColor = "#3FB950"
greenBackgroundColor = "#0F2417"
yellowColor = "#D29922"
yellowTextColor = "#D29922"
yellowBackgroundColor = "#272115"
orangeColor = "#DB6D28"
orangeTextColor = "#DB6D28"
orangeBackgroundColor = "#2A1D14"
redColor = "#F85149"
redTextColor = "#F85149"
redBackgroundColor = "#2A1618"
blueColor = "#4493F8"
blueTextColor = "#4493F8"
blueBackgroundColor = "#121D2F"
grayColor = "#9198A1"
grayTextColor = "#9198A1"
grayBackgroundColor = "#151B23"
