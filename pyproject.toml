[project]
name = "forecasting-engine"
version = "0.1.0"
description = "Forecasting engine for strategic asset allocation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "duckdb>=1.1",
    "openpyxl>=3.1.5",
    "pandas-market-calendars>=5.4.0",
    "pandera[pandas]>=0.33.1",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "optuna>=3.6",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecasting_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Streamlit puts the main script's directory on sys.path, so pages import
# sibling modules by bare name. Mirror that here so tests import them the
# same way the running app does.
#
# "src" is added explicitly rather than relied on via the editable install:
# this sandbox's filesystem has shown itself unreliable at keeping the
# editable-install .pth file in a working state between invocations, and
# pytest's own pythonpath insertion doesn't depend on it at all.
pythonpath = ["app", "src"]
markers = ["real_defaults: run the Models page under its own default settings"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
